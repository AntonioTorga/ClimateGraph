repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # NetCDF / image binaries and LFS pointer files must not be touched.
        exclude: '\.(nc|jpg|png|zip)$'
      - id: end-of-file-fixer
        exclude: '\.(nc|jpg|png|zip)$'
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        # Plenty of headroom for non-LFS files; the real big NetCDFs go through
        # Git LFS already (see `.gitattributes`). This catches accidental
        # binary commits that bypass LFS.
        args: [--maxkb=5000]
