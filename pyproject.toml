[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name= "ClimateGraph"
version = "0.3.0"
description = "A CLI tool for graphing Climate Data"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [{ name = "Antonio Andrés Torga Mellado", email = "antonio.torga@ug.uchile.cl" }]
dependencies = [
        "typer>=0.12",
        "xarray",
        "dask",
        "netcdf4",
        "numpy",
        "matplotlib",
        "pyyaml",
        "pyresample",
        "cartopy",
        "pydantic",
        "pint",
        "pint_xarray",
		"geopandas",
		"regionmask",
		"h5netcdf",
		"h5py",
		"dask"
]

[project.optional-dependencies]
dev = [
        "black"
]

test = [
        "pytest",
        "pytest-cov",
        "pillow",
]

[tool.setuptools]
packages = ["ClimateGraph", "ClimateGraph.data", "ClimateGraph.plot","ClimateGraph.reader"]

[project.scripts]
ClimateGraph= "ClimateGraph.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that touch the NetCDF samples in test_data/data/ or render figures end-to-end",
    "integration: end-to-end tests that exercise AppKernel.run() against a real YAML",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["ClimateGraph"]
omit = [
    "*/tests/*",
    "*/test_data/*",
    "ClimateGraph/cli.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
