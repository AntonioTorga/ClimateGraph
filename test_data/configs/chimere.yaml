analysis:
  output_path:  "./test_data/results/chimere"
  debug: True

data:
  CHIMERE:
     path: "/home/cr2/nhuneeus/RESULTS/CHIMERE2023/FDCYT-STGOPTOMTT/chim_STGOPTOMTT_202106*out.nc"
     topology: RegularGrid
     reader: CHIMERE
     vars:
        PM10:
         name: PM10
         unit: "ug/m**3"
        PM25:
         name: PM25
         unit: "ug/m**3"
        NO2:
          name: NO2
          unit: "ppb"
        O3:
          name: O3
          unit: "ppb"
        CO:
          name: CO
          unit: "ppb"
        SO2:
          name: SO2
          unit: "ppb"

plots:
  TC:
    type: timecycle
    data: "CHIMERE"
    time: "1/6/2021-30/6/2021"
    timestep: "h"
    time_buckets: "hour"
    vars:
      PM10: "ug/m**3"
      PM25: "ug/m**3"
      O3: "ppb"
      CO: "ppb"
      SO2: "ppb"
      NO2: "ppb"

  surface_map:
    type: spatial-map
    data: "CHIMERE"
    time: "15/6/2021"
    dim_reduce:
      z: {method: isel, value: 0}
    reduction_method: mean
    levels: 12
    vars:
      PM25: "ug/m**3"
      NO2: "ppb"

  # cross_section:
  #   type: custom
  #   time: "15/6/2021"
  #   dim_reduce:
  #     time: mean
  #     x: mean
  #   vars: [PM25]
  #   subplots:
  #     - type: contourf
  #       dataset: CHIMERE
  #       x: latitude
  #       y: z
  #       levels: 14
  #       cmap: viridis
  #   title: "PM2.5 latitude-height cross-section (zonal mean)"

  layer_compare:
    type: custom
    time: "6/2021"
    dim_reduce:
      x: mean
      y: mean
    vars: [NO2]
    subplots:
      - type: series
        dataset: CHIMERE
        x: time
        dim_reduce: {z: {method: isel, value: 0}}
        label: "surface (z=0)"
        color: black
      - type: series
        dataset: CHIMERE
        x: time
        dim_reduce: {z: {method: isel, value: 5}}
        label: "upper level (z=5)"
        color: tab:red
    title: "NO2 at two vertical levels"
