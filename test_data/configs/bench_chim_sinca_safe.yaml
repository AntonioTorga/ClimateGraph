# Safe load benchmark: Chimere (model) vs SINCA (obs), PM25 timeseries.
# Pair with bench_chim_sinca_unsafe.yaml — only `load_mode` differs.
# Time both runs to compare lazy-fused (safe) vs per-file open + concat
# (unsafe). With single files per dataset the gap is small; for a
# meaningful benchmark glob multiple files into each `path`.

analysis:
  output_path: "./test_data/results/bench-safe"
  debug: True

data:
  SINCA:
    path: "./test_data/data/SINCA-CAL-Daily-2000-2026.nc"
    topology: PointSurface
    reader: SINCA
    load_mode: safe
    vars:
      PM25:
        name: PM25_ug|m3
        unit: "ug/m**3"

  CHIMERE:
    path: "./test_data/data/chim_reduced_2021-06.nc"
    topology: RegularGrid
    reader: chimere
    load_mode: safe
    vars:
      PM25:
        name: PM25
        unit: "ug/m**3"

plots:
  ts_pm25:
    type: timeseries
    base: "SINCA"
    other_data: ["CHIMERE"]
    time: "1/6/2021-30/6/2021"
    timestep: "D"
    radius_of_influence: 10000
    vars:
      PM25: "ug/m**3"
