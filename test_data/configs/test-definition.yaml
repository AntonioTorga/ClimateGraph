analysis:
  output_path:  "./test_data/results/test-definition/"
  debug: True

data:
  WRF_D02:
    path: "./test_data/data/wrf-20*.nc"
    topology: RegularGrid
    reader: wrf
    vars:
      Temperatura:
        name: T2
        unit: "kelvin"
      Presion:
        name: PSFC
        unit: "pascal"
  DMC:
    path: "./test_data/data/dmc*.nc"
    topology: PointSurface
    reader: DMC
    vars:
      Temperatura:
        name: temperatura
        unit: "degC"
      Presion:
        name: presionEstacion
        unit: "hectopascal"
domains:
  # RM / Litoral reproject onto the DMC stations first (resample_to), so the WRF
  # grid gains the station attributes (region / zonaGeografica) it can then be
  # filtered by. Applied to DMC itself, the resample short-circuits to identity.
  RM:
    type: attr
    resample_to: DMC
    radius_of_influence: 10000
    field_name: region
    field_value:  13
  Litoral:
    type: attr
    resample_to: DMC
    radius_of_influence: 10000
    field_name: zonaGeografica
    field_value: Litoral
  Poly1:
    type: polygon
    vertex: [[-73.51507, -33.43938],[-73.51507, -36.46943],[-69.68720, -36.46943],[-69.68720, -33.43938]]
plots:
  ts:
    type: timeseries
    data: ["DMC", "WRF_D02"]
    domains: ["RM", "Litoral"]
    time: 1/1/2019-1/2/2019
    timestep: "D"
    vars:
      Temperatura: kelvin
      Presion: pascal
  scatter:
    type: scatter
    data: ["DMC", "WRF_D02"]
    domains: ["RM"]
    time: 1/1/2019-1/2/2019
    timestep: "D"
    dimension: time
    vars:
      Temperatura: kelvin
      Presion: pascal
  so:
    type: spatial-overlay
    base: WRF_D02
    superposed: DMC
    domains: ["Poly1"]
    vars:
      Temperatura: kelvin
      Presion: pascal
    time: 1/1/2019-1/2/2019
    reduction_method: mean
  map_grid:
    type: spatial-map
    data: WRF_D02
    vars:
      Temperatura: kelvin
    time: 1/1/2019-1/2/2019
    reduction_method: mean
  map_point:
    type: spatial-map
    data: DMC
    vars:
      Temperatura: kelvin
    time: 1/1/2019-1/2/2019
    reduction_method: mean
