name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

# Cancel any in-progress run on the same branch when a new push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # The committed .lfsconfig sets `fetchexclude = *` so neither clones
        # nor this checkout pull LFS data. CI runs only the in-memory tests
        # (the @slow tests that need NetCDF samples are filtered out below).
        with:
          lfs: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install system libs for cartopy / pyresample / netCDF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgeos-dev libproj-dev libhdf5-dev libnetcdf-dev

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]

      - name: Lint and format (pre-commit)
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run tests (fast path) with coverage
        run: pytest -m "not slow" --cov --cov-report=term --cov-report=xml --cov-report=html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: |
            .coverage
            coverage.xml
            htmlcov/
          retention-days: 14

  docs:
    name: docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install system libs for cartopy / pyresample / netCDF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgeos-dev libproj-dev libhdf5-dev libnetcdf-dev

      - name: Install package with docs extra
        run: |
          python -m pip install --upgrade pip
          pip install -e .[docs]

      - name: Build documentation
        run: make -C docs html SPHINXOPTS="-W --keep-going"

      - name: Upload built documentation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html/
          retention-days: 14
